name: validate-skill
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify synced bundles
        run: python3 scripts/validate.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Build release packages
        run: python3 scripts/build.py --zip
      - name: Verify synced bundles again
        run: python3 scripts/validate.py
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ux-reverse-engineering-bundles
          path: dist/*.zip
